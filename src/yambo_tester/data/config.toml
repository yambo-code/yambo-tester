# Empty parameter means default
[parameters]
label = "cirun"
tests_dir = ""
scratch_dir = "scratch"
cache_dir = "cache"
yambo_bin = ""
mpi_launcher = "mpirun"
nprocs = 2
thrs = 1
tollerance = 0.1
runlevels = []
download_link = ""
yambo_version = ""

[executables]
# required executables
yambo = "yambo"
p2y = "p2y"
a2y = "a2y"
# Optional executables are registered explicitly in a local config.toml or with --exe KEY=VALUE.

[cluster]
# SLURM settings used by --submit (benchmark mode)
partition = ""
account = ""
qos = ""           # empty: no --qos line
time = "01:00:00"
modules = []
setup = []          # raw shell lines run before the command (e.g. "source env.sh")
mpi = ""           # launcher or wrapper script; empty: [parameters].mpi_launcher
tasks_per_node = 0  # MPI tasks per node of this machine (0: from the workflow [benchmark])
threads = 0         # OpenMP threads per task (0: from the workflow [benchmark])
nodes = []          # node counts to run (empty: from the workflow [benchmark])
template = ""       # own sbatch template (empty: packaged data/slurm_job.sh)

[tests]
Al_bulk = ["DFT", "GW-OPTICS", "ELPH"]
PA_chain = ["DFT", "PA_chain"]
Si_bulk = ["DFT"]
He = ["DFT"]
Nickel = ["DFT"]
AlAs = ["DFT"]
hBN = ["DFT"]
Iron_With-SOC = ["DFT"]
Iron_Without-SOC = ["DFT"]
