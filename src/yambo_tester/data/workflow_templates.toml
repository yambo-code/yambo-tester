[p2y]
exe = "p2y"
runlevel = "p2y"
nprocs = 1
dependencies = []

[p2y.reference]
STDOUT = ["Game Over"]
"REFERENCE/Y6/o-{step}.ns.electrons" = ["SAVE/ns.electrons", "EIGENVALUES"]
"REFERENCE/Y6/o-{step}.ns.kb_pp_pwscf_fragment_1" = ["SAVE/ns.kb_pp_pwscf_fragment_1", "PP_KB_K1"]
"REFERENCE/Y6/o-{step}.ns.wf_fragments_1_1" = ["SAVE/ns.wf_fragments_1_1", "WF_COMPONENTS_@_SP_POL1_K1_BAND_GRP_1"]

[p2y.versions."5".reference]
STDOUT = ["== P2Y completed =="]
"REFERENCE/Y5/o-{step}.ns.db1" = ["SAVE/ns.db1", "EIGENVALUES"]
"REFERENCE/Y5/o-{step}.ns.kb_pp_pwscf_fragment_1" = ["SAVE/ns.kb_pp_pwscf_fragment_1", "PP_KB_K1"]
"REFERENCE/Y5/o-{step}.ns.wf_fragments_1_1" = ["SAVE/ns.wf_fragments_1_1", "WF_COMPONENTS_@_SP_POL1_K1_BAND_GRP_1"]

[a2y]
exe = "a2y"
runlevel = "a2y"
nprocs = 1
dependencies = []

[a2y.reference]
STDOUT = ["Game Over"]

[a2y.versions."5".reference]
STDOUT = ["== Writing DB2 (wavefunctions) + nlPP ..."]

[init]
exe = "yambo"
output = "{step}"
runlevel = "init"
dependencies = ["{previous_step}"]

[init.reference]
"REFERENCE/Y6/o-{step}.ndb.RL_shells" = ["SAVE/ndb.RL_shells", "ng_in_shell", "E_of_shell"]
"REFERENCE/Y6/o-{step}.ndb.KPT_indexes_fragment_1" = ["SAVE/ndb.KPT_indexes_fragment_1", "Qindx"]
"REFERENCE/Y6/o-{step}.ndb.KPT_indexes_fragment_2" = ["SAVE/ndb.KPT_indexes_fragment_2", "Sindx"]
"REFERENCE/Y6/r-{step}_setup" = ["Game Over & Game summary"]

[init.versions."5".reference]
"REFERENCE/Y5/o-{step}.ndb.gops" = ["SAVE/ndb.gops", "ng_in_shell", "E_of_shell"]
"REFERENCE/Y5/o-{step}.ndb.kindx" = ["SAVE/ndb.kindx", "Qindx", "Sindx"]
"REFERENCE/Y5/r-{step}_setup" = ["Game Over & Game summary"]

[HF]
exe = "yambo"
input = "INPUTS/Y6/{step}"
output = "{step}"
runlevel = "hf"
nprocs = 1
dependencies = ["{previous_step}"]

[HF.reference]
"REFERENCE/Y6/o-{step}.Fock-V_xc_qp" = ["o-{step}.Fock-V_xc_qp"]
"REFERENCE/Y6/o-{step}.ndb.SE_Fock" = ["{step}/ndb.SE_Fock", "SPECTRAL_FUNCTION"]
"REFERENCE/Y6/o-{step}.ndb.SE_Kohn_Sham" = ["{step}/ndb.SE_Kohn_Sham", "SPECTRAL_FUNCTION"]
"REFERENCE/Y6/r-{step}_HF_and_locXC" = ["Game Over & Game summary"]

[HF.versions."5"]
input = "INPUTS/Y5/{step}"

[HF.versions."5".reference]
"REFERENCE/Y5/o-{step}.hf" = ["o-{step}.hf"]
"REFERENCE/Y5/o-{step}.ndb.HF_and_locXC" = ["{step}/ndb.HF_and_locXC", "Sx", "Vxc"]
"REFERENCE/Y5/r-{step}_HF_and_locXC" = ["Game Over & Game summary"]
