# Bulk Si GW: HF, COHSEX, PPA (Newton and Green's function solvers), full-frequency (Newton and
# secant), RIM, sphere cutoff and finite temperature. ONCV PBE, 20 Ry, 4x4x4 k-grid (8 IBZ points),
# 10 bands, EXXRLvcs=300 RL, 51 RL response block, QP k 1-8 bands 3-6.
#
# Y6 and Y5 references come from the same inputs. At porting time the Y6 results were checked
# against the Y5 ones state by state (common states, see below) and agree to:
#   HF 6e-6 eV | COHSEX 8e-6 eV | PPA E-Eo 3e-5 eV, Z 3e-5 | RIM+PPA 5e-3 eV (Monte Carlo)
#   sphere cutoff HF 7e-6 eV | finite-T PPA 6e-5 eV, COHSEX 1e-5 eV | FF 6e-5 eV
#   FF secant 2e-4 eV, Z 2e-3 | GF solver: Sigma 2.5e-4 eV, QP peak on the same grid point
# Y6 builds the QP basis respecting degeneracies (K1 uses bands 2-4, Y5 3-6), so the two
# versions' files have different rows and are never compared with each other here.
# Tolerances are relative (numpy rtol, atol 1e-6): 1e-3 for deterministic quantities,
# looser where the README of testing-materials/Silicon/GW documents intrinsic noise.
sha256 = "b82315a4c4ab058cda5a2d80055be6fc880aa41f56b358c7267cd204a9d9fa0b"
tarball_url = "https://media.yambo-code.eu/robots/databases/y6"

[yambo_versions]
supported = ["5", "6"]

[00_p2y]
step_type = "p2y"
input_dir = "si.save"

[01_init]
step_type = "init"

[02_hf]
exe = "yambo"
input = "INPUTS/Y6/02_hf"
output = "02_hf"
runlevel = "hf"
dependencies = ["01_init"]

[02_hf.reference]
"REFERENCE/Y6/o-02_hf.Fock-V_xc_qp" = { path = "o-02_hf.Fock-V_xc_qp", tolerance = 0.001 }
"REFERENCE/Y6/o-02_hf.ndb.QP_Fock-V_xc" = { path = "02_hf/ndb.QP_Fock-V_xc", variables = ["QP energies"], tolerance = 0.001 }
"REFERENCE/Y6/r-02_hf_self_energy" = ["Game Over & Game summary"]

[02_hf.versions."5"]
input = "INPUTS/Y5/02_hf"

[02_hf.versions."5".reference]
"REFERENCE/Y5/o-02_hf.hf" = { path = "o-02_hf.hf", tolerance = 0.001 }
"REFERENCE/Y5/r-02_hf_HF_and_locXC" = ["Game Over & Game summary"]

[03_cohsex]
exe = "yambo"
input = "INPUTS/Y6/03_cohsex"
output = "03_cohsex"
runlevel = "qp"
dependencies = ["01_init"]

[03_cohsex.reference]
"REFERENCE/Y6/o-03_cohsex.Fock-V_xc-CoHSeX_qp" = { path = "o-03_cohsex.Fock-V_xc-CoHSeX_qp", tolerance = 0.001 }
"REFERENCE/Y6/o-03_cohsex.ndb.static_dielectric_matrix" = { path = "03_cohsex/ndb.static_dielectric_matrix", variables = ["EM1S_X_at_Q_1"], tolerance = 0.001 }
"REFERENCE/Y6/o-03_cohsex.ndb.QP_Fock-V_xc-CoHSeX" = { path = "03_cohsex/ndb.QP_Fock-V_xc-CoHSeX", variables = ["QP energies"], tolerance = 0.001 }
"REFERENCE/Y6/r-03_cohsex_dipoles_X_static_self_energy" = ["Game Over & Game summary"]

[03_cohsex.versions."5"]
input = "INPUTS/Y5/03_cohsex"

[03_cohsex.versions."5".reference]
"REFERENCE/Y5/o-03_cohsex.qp" = { path = "o-03_cohsex.qp", tolerance = 0.001 }
"REFERENCE/Y5/o-03_cohsex.ndb.em1s_fragment_1" = { path = "03_cohsex/ndb.em1s_fragment_1", variables = ["X_Q_1"], tolerance = 0.001 }
"REFERENCE/Y5/o-03_cohsex.ndb.QP" = { path = "03_cohsex/ndb.QP", variables = ["QP_E"], tolerance = 0.001 }
"REFERENCE/Y5/r-03_cohsex_HF_and_locXC_gw0_dyson_dipoles_cohsex_em1s_el_el_corr" = ["Game Over & Game summary"]

[04_ppa]
