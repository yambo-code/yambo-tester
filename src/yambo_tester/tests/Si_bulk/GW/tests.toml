# Full-frequency + secant solver (DysSolver="s"). The root is accepted at |f|<=1 meV and Z is a
# finite difference at the stopping point, hence the looser tolerance. dSc/dw|Eo and Im(Z)
# (skipped columns) move by ~2% with the number of MPI tasks because the stopping point does.
[11_ff_s]
exe = "yambo"
input = "INPUTS/Y6/11_ff_s"
output = "11_ff_s"
runlevel = "qp"
dependencies = ["01_init"]

[11_ff_s.reference]
"REFERENCE/Y6/o-11_ff_s.Fock-V_xc-Real-Axis_qp" = { path = "o-11_ff_s.Fock-V_xc-Real-Axis_qp", tolerance = 0.01, skip_columns = [9, 11] }
"REFERENCE/Y6/o-11_ff_s.ndb.QP_Fock-V_xc-Real-Axis" = { path = "11_ff_s/ndb.QP_Fock-V_xc-Real-Axis", variables = ["QP energies"], tolerance = 0.01 }
"REFERENCE/Y6/r-11_ff_s_dipoles_X_dynamic_self_energy" = ["Game Over & Game summary"]

[11_ff_s.versions."5"]
input = "INPUTS/Y5/11_ff_s"

[11_ff_s.versions."5".reference]
"REFERENCE/Y5/o-11_ff_s.qp" = { path = "o-11_ff_s.qp", tolerance = 0.01, skip_columns = [10, 12] }
"REFERENCE/Y5/o-11_ff_s.ndb.QP" = { path = "11_ff_s/ndb.QP", variables = ["QP_E"], tolerance = 0.01 }
"REFERENCE/Y5/r-11_ff_s_HF_and_locXC_gw0_dyson_em1d_el_el_corr" = ["Game Over & Game summary"]
