# PPA + Green's function solver (DysSolver="g"). Neither version writes a QP table for this
# solver; the per-state spectral functions are the result. Two states shared by both versions:
# the top valence state at Gamma (K1 b4) and the bottom conduction state at K2 (b5). Looser
# tolerance: near the QP peak |G| ~ 1/Im(Sigma) amplifies the printed digits.
[09_ppa_gf]
exe = "yambo"
input = "INPUTS/Y6/09_ppa_gf"
output = "09_ppa_gf"
runlevel = "gf"
dependencies = ["01_init"]

[09_ppa_gf.reference]
"REFERENCE/Y6/o-09_ppa_gf.GF_band_4_k_1" = { path = "o-09_ppa_gf.GF_band_4_k_1", tolerance = 0.01 }
"REFERENCE/Y6/o-09_ppa_gf.GF_band_5_k_2" = { path = "o-09_ppa_gf.GF_band_5_k_2", tolerance = 0.01 }
"REFERENCE/Y6/o-09_ppa_gf.ndb.QP_Fock-V_xc-Plasmon-Pole" = { path = "09_ppa_gf/ndb.QP_Fock-V_xc-Plasmon-Pole", variables = ["QP energies", "Ren Factors"], tolerance = 0.001 }
"REFERENCE/Y6/r-09_ppa_gf_dipoles_X_PPA_self_energy" = ["Game Over & Game summary"]

[09_ppa_gf.versions."5"]
input = "INPUTS/Y5/09_ppa_gf"

[09_ppa_gf.versions."5".reference]
"REFERENCE/Y5/o-09_ppa_gf.G_Sc_band_4_k_1" = { path = "o-09_ppa_gf.G_Sc_band_4_k_1", tolerance = 0.01 }
"REFERENCE/Y5/o-09_ppa_gf.G_Sc_band_5_k_2" = { path = "o-09_ppa_gf.G_Sc_band_5_k_2", tolerance = 0.01 }
"REFERENCE/Y5/r-09_ppa_gf_HF_and_locXC_gw0_dyson_em1d_ppa_el_el_corr" = ["Game Over & Game summary"]

