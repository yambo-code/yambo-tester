# PPA reading the databases of 04_ppa_base (-J 04_ppa_reuse,04_ppa_base): it writes no
# screening database of its own, the report must show the screening read back. Y5 also reads
# ndb.QP back and only re-solves Dyson: its table has no Sigma columns and no ndb.QP is written.
# Y5 COHSEX variants skip the spurious Width columns of the static self-energy (11, 12), which
# move with the distribution as in Si_bulk/GW 08_cohsex_T.
[04_ppa_reuse]
exe = "yambo"
input = "INPUTS/Y6/04_ppa_reuse"
output = "04_ppa_reuse"
runlevel = "qp"
nprocs = 2
flags = "04_ppa_base"
dependencies = ["04_ppa_base"]

[04_ppa_reuse.reference]
"REFERENCE/Y6/o-04_ppa_reuse.Fock-V_xc-Plasmon-Pole_qp" = { path = "o-04_ppa_reuse.Fock-V_xc-Plasmon-Pole_qp", tolerance = 0.001 }
"REFERENCE/Y6/o-04_ppa_reuse.ndb.QP_Fock-V_xc-Plasmon-Pole" = { path = "04_ppa_reuse/ndb.QP_Fock-V_xc-Plasmon-Pole", variables = ["QP energies", "Ren Factors"], tolerance = 0.001 }
"REFERENCE/Y6/r-04_ppa_reuse" = { contains = "[RD@./04_ppa_base//ndb.plasmon-pole_dielectric_matrix_header]" }

[04_ppa_reuse.versions."5"]
input = "INPUTS/Y5/04_ppa_reuse"

[04_ppa_reuse.versions."5".reference]
"REFERENCE/Y5/o-04_ppa_reuse.qp" = { path = "o-04_ppa_reuse.qp", tolerance = 0.001 }
"REFERENCE/Y5/r-04_ppa_reuse" = { contains = "[RD./04_ppa_base//ndb.pp]" }

