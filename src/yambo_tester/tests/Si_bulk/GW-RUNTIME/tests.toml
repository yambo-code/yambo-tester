# Bulk Si GW, runtime variants of Si_bulk/GW (same physics, own copy of the Si_bulk/GW data). Every
# step repeats one Si_bulk/GW step (02_hf, 03_cohsex, 04_ppa, 10_ff) with a different MPI task
# count, parallel distribution (Y6 *_CPU/*_ROLEs, Y5 SX/SE/X_and_IO_CPU), PAR_def_mode, linear-
# algebra mode, database I/O switch, or database reuse from a previous step, and is checked against
# the Si_bulk/GW reference of that step: results must not depend on how the run is organised.
# nprocs is fixed per step (4 at most); the global --np does not apply.
sha256 = "4d593add74746426aef4ea2c88f5282c06b91c8727e1498217553b735540077d"
tarball_url = "https://media.yambo-code.eu/robots/databases/y6"

[yambo_versions]
supported = ["5", "6"]

[00_p2y]
step_type = "p2y"
input_dir = "si.save"

[01_init]
step_type = "init"

# HF with the QP states distributed
[02_hf_qp]
exe = "yambo"
input = "INPUTS/Y6/02_hf_qp"
output = "02_hf_qp"
runlevel = "hf"
nprocs = 4
dependencies = ["01_init"]

[02_hf_qp.reference]
"REFERENCE/Y6/o-02_hf_qp.Fock-V_xc_qp" = { path = "o-02_hf_qp.Fock-V_xc_qp", tolerance = 0.001 }
"REFERENCE/Y6/o-02_hf_qp.ndb.QP_Fock-V_xc" = { path = "02_hf_qp/ndb.QP_Fock-V_xc", variables = ["QP energies"], tolerance = 0.001 }
"REFERENCE/Y6/r-02_hf_qp" = ["Game Over & Game summary"]

[02_hf_qp.versions."5"]
input = "INPUTS/Y5/02_hf_qp"

[02_hf_qp.versions."5".reference]
"REFERENCE/Y5/o-02_hf_qp.hf" = { path = "o-02_hf_qp.hf", tolerance = 0.001 }
"REFERENCE/Y5/r-02_hf_qp" = ["Game Over & Game summary"]

# HF with the q-points distributed
