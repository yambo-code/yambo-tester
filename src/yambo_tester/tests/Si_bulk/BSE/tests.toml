# Bulk Si BSE (bse plugin, conventional: no symadapt): exciton spectrum at q->0 for the kernel
# variants. ONCV PBE, 20 Ry, 4x4x4 k-grid (64 BZ), 10 bands; BSE bands 1-8 (1024 transitions),
# resonant, field (1,0,0), 0-10 eV, 100 steps, damping 0.1 eV. Exchange 100 RL; the *181 runs use
# 181 RL for exchange and W. Screening: em1s bands 1-10, 51 RL (02_em1s) or 181 RL (03_em1s181).
# Same QE SAVE as Si_bulk/GW (si.save byte-identical), each version runs its own p2y.
#
# 2026-11-05: Y6-bse spectra regenerated after the kernel moved to SCATTER_block_engine (GEMM summation order:
# kernel ~2e-7 relative, sharp SP peaks move up to 7e-4 of the file maximum).
# 2026-11-06: 06/19 Haydock refs regenerated after Haydock moved to LA_lanczos + COLL_M_by_V: SP rounding moves the
# stop from 91 to 92 iterations; vs diago (04) old 7.4e-5, new 1.2e-4 of the peak, 2.4e-5 with HayTrs=1e-5.
# 2026-11-06: 06/11/19/21 refs regenerated after the work-weighted row/column split of the kernel (pass B): the kernel is
# bit-identical, only the reduction grouping over CPUs changes (Haydock 7e-5/4.5e-4, SLEPc 1e-6, SLK 6e-8 of the peak).
# 2026-11-08: 05/06/17(q3)/18(q2,q3)/19 refs regenerated with the binary after the develop merge: 1.0-1.9e-3 relative
# at sharp points, SP rounding (serial vs SLK diago 6e-5, each vs the old ref ~1e-4 of the peak).
#
# Yambo 6 runs only with --variant bse (develop with the bse plugin built in). Its references are in
# REFERENCE/Y6-bse. The screening uses the physical G sets of develop: the |q+G| ball of every q (XqGRule=2),
# closed under the little group of q, see "Symmetric Screening at Every q.html" in the Yambo 6 tree.
#
# Yambo 5 cross-checks (REFERENCE/Y5, same inputs, tester metric = max element relative difference on the
# significant values, tolerance rounded up from the value measured when porting):
#  - unscreened kernels, same in both G rules: HARTREE bar 8.5e-4, HF 181 RL 5.8e-4 -> 2e-3;
#    Haydock (HayTrs=-0.001) bar 1.3e-2, full 3.5e-3, both codes stop at the threshold -> 3e-2;
#  - screened kernels with the Yambo 5 G block (Y5LegacyGBlock, steps 12-15, their own screening):
#    SEX 51 RL 8.6e-3 (Yambo 5 |G| block truncation at zone-boundary q, Y5_BUGS #16) -> 2e-2,
#    SEX 181 RL 2.5e-4 -> 2e-3.
#  The screened steps 08-11 use the |q+G| sets and are not compared with Yambo 5: at 51 RL the W truncation of
#  the |G| block alone moves the spectrum by 6.8% of the peak (2.3% with |q+G|), both converge to the same limit.
#  Columns: E, Im/Re eps (BSE), Im/Re eps (IP). The Y5 Haydock file has two more (6, 7): skip_columns.
# Y5 diago with Lkind=full returns no spectrum (Y5_BUGS #18): 05_hartree_full runs the Y5 Haydock
# (hay_full input) and Y6 diago is compared with it.
sha256 = "8df197df984e486e07414f487b0bfd2b44e6906061a7039f0dcd9884f5a3dfdc"
tarball_url = "https://media.yambo-code.eu/robots/databases/y6"

