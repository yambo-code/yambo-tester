"REFERENCE/Y6-bse/o-02_em1s.ndb.static_dielectric_matrix" = { path = "02_em1s/ndb.static_dielectric_matrix", variables = ["EM1S_X_at_Q_1"], tolerance = 0.001 }
"REFERENCE/Y6-bse/r-02_em1s" = ["Game Over & Game summary"]

