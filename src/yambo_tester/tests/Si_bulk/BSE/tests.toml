# Symmetry-adapted BSE (symadapt plugin built in too: --variant bse-sym). Same case as 09_sex181, with BSESymm:
# kernel at one k per orbit, other rows rebuilt as U H U^+, irrep blocks diagonalized one by one. The spectrum
# is compared with a copy of the conventional 09 reference (o-23/o-24 = o-09, keep them equal): at porting time sym vs conventional 1.9e-5 of the peak,
# lowest 40 excitons 5.7e-6 eV. Builds without symadapt skip these steps (requires = ["symadapt"]).
# ndb.BSE_excitons: the first 100 levels in energy order, as the conventional run (the symmetric path sorts
# the irrep blocks before writing since 2026-11-09; the reference of 2026-11-08 was in block order).
[23_sex181_sym]
exe = "yambo"
input = "INPUTS/Y6/23_sex181_sym"
output = "23_sex181_sym"
runlevel = "bse"
flags = "03_em1s181"
dependencies = ["03_em1s181"]
requires = ["symadapt"]

[23_sex181_sym.reference]
"REFERENCE/Y6-bse/o-23_sex181_sym.eps_q1_bse_SEX" = { path = "o-23_sex181_sym.eps_q1_bse_SEX", tolerance = 0.001 }
"REFERENCE/Y6-bse/o-23_sex181_sym.ndb.BSE_excitons" = { path = "23_sex181_sym/ndb.BSE_excitons", variables = ["BSE_EXCITON_ENERGIES"], tolerance = 0.001 }
"REFERENCE/Y6-bse/r-23_sex181_sym" = { contains = "T_2  G_15 P_4" }
"REFERENCE/Y6-bse/r-23_sex181_sym_Wcheck" = { contains = "[BSE SYM W]" }

# Bright blocks only (BSESymmBright): the dark blocks carry no dipole, so the spectrum equals the full one.
