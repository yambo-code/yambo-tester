# BSESymm at finite exciton momentum (2026-11-10): same case as 18_sex_q. Only the little group of q (C3v at q2, q3)
# leaves H(q) invariant, so seeds, orbits and irreps are those of G_q, and the hole of a transition is rotated at k-q.
# The spectra are compared with copies of the conventional 18 references (o-25/o-26 = o-18, keep them equal): sym vs
# conventional 1.7e-5 (q1), 2.5e-5 (q2), 1.6e-5 (q3) of the peak, all 1024 exciton energies 9e-7 eV. 26: only the
# identity irrep of G_q is solved (the vertex rho(q) is a scalar), the same spectrum. q2 tolerance 2e-3: the tester metric is
# relative per point, and at one sharp point (|eps|=0.23, 4e-5 of the peak) the sym/conventional SP difference is 1.1e-3.
[25_sex_q_sym]
exe = "yambo"
input = "INPUTS/Y6/25_sex_q_sym"
output = "25_sex_q_sym"
runlevel = "bse"
flags = "02_em1s"
