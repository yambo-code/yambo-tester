[05_ff.versions."5".reference]
"REFERENCE/Y5/o-05_ff.qp" = { path = "o-05_ff.qp", tolerance = 0.005 }
"REFERENCE/Y5/o-05_ff.ndb.QP" = { path = "05_ff/ndb.QP", variables = ["QP_E", "QP_Z"], tolerance = 0.005 }
"REFERENCE/Y5/r-05_ff_REPORT5" = ["Game Over & Game summary"]

[06_ppa_ws]
exe = "yambo"
input = "INPUTS/Y6/06_ppa_ws"
output = "06_ppa_ws"
runlevel = "rim_cut"
dependencies = ["01_init"]

[06_ppa_ws.reference]
"REFERENCE/Y6/o-06_ppa_ws.Fock-V_xc-Plasmon-Pole_qp" = { path = "o-06_ppa_ws.Fock-V_xc-Plasmon-Pole_qp", tolerance = 0.01 }
"REFERENCE/Y6/o-06_ppa_ws.ndb.QP_Fock-V_xc-Plasmon-Pole" = { path = "06_ppa_ws/ndb.QP_Fock-V_xc-Plasmon-Pole", variables = ["QP energies", "Ren Factors"], tolerance = 0.01 }
"REFERENCE/Y6/r-06_ppa_ws_rim_cut_dipoles_X_PPA_self_energy" = ["Game Over & Game summary"]

[06_ppa_ws.versions."5"]
input = "INPUTS/Y5/06_ppa_ws"

[06_ppa_ws.versions."5".reference]
"REFERENCE/Y5/o-06_ppa_ws.qp" = { path = "o-06_ppa_ws.qp", tolerance = 0.01 }
"REFERENCE/Y5/o-06_ppa_ws.ndb.QP" = { path = "06_ppa_ws/ndb.QP", variables = ["QP_E", "QP_Z"], tolerance = 0.01 }
"REFERENCE/Y5/r-06_ppa_ws_REPORT5" = ["Game Over & Game summary"]
