"REFERENCE/Y5/o-04_ppa.ndb.pp_fragment_1" = { path = "04_ppa/ndb.pp_fragment_1", variables = ["X_Q_1"], tolerance = 0.01 }
"REFERENCE/Y5/r-04_ppa_HF_and_locXC_gw0_dyson_rim_cut_em1d_ppa_el_el_corr" = ["Game Over & Game summary"]

# RIM-W + PPA + slab cutoff + RIM
