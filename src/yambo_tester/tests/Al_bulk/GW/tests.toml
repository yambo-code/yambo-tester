"REFERENCE/Y6/o-06_ppa_T.ndb.QP_Fock-V_xc-Plasmon-Pole" = { path = "06_ppa_T/ndb.QP_Fock-V_xc-Plasmon-Pole", variables = ["QP energies", "Ren Factors"], tolerance = 0.001 }
"REFERENCE/Y6/r-06_ppa_T_dipoles_X_PPA_self_energy" = ["Game Over & Game summary"]

