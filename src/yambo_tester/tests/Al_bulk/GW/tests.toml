"REFERENCE/Y5/o-05_ff.ndb.QP" = { path = "05_ff/ndb.QP", variables = ["QP_E", "QP_Z"], tolerance = 0.005 }
"REFERENCE/Y5/r-05_ff_REPORT5" = ["Game Over & Game summary"]

